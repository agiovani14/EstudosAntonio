<!DOCTYPE html>
<html lang="pt-BR"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Treino de Matemática</title> 
<style> 
body 
{ 
      font-family: Arial, Helvetica, sans-serif; 
      background: #f0f4f8; 
      display: flex; 
      justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
} 

.painel 
{ 
     width: 600px; max-width: 90%; 
     background: white; 
     padding: 30px; border-radius: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.2); text-align: center; 
} 

h1 
{ 
     color: #2c3e50; 
     margin-bottom: 25px; 
} 

.conta 
{ 
     display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; 
} 

.numero
{ 
      font-size: 32px; font-weight: bold; min-width: 80px; 
}

.operador 
{ 
      font-size: 35px; font-weight: bold; 
} 

#resposta
{ 
      width: 100px; height: 55px; font-size: 30px; text-align: center; border: 3px solid #3498db; border-radius: 10px; 
} 

button
 { background: #3498db; 
color: white; border: none; 
border-radius: 10px; 
padding: 12px 30px; f
ont-size: 18px; 
cursor: pointer; 
} 
button:hover
 { background: #2980b9;
 } 
button:disabled { background: #aaa; cursor: not-allowed; } 
#semaforo { margin-top: 20px; } 
.placar { margin-top: 20px; font-size: 20px; font-weight: bold; } 
.acertos { color: green; } 
.erros 
{ color: red;
} 
.mensagem 
{ height: 30px; margin-top: 15px; font-size: 20px; font-weight: bold; 
}

</style> 
</head> 
<body> <div class="painel"> 
<h1> Treino de Matemática</h1> 
<div class="conta"> 
<span id="num1" class="numero">0</span> 
<span id="operador" class="operador"></span>
<span id="num2" class="numero">0</span> 
<span class="operador">=</span> 
<input type="number" id="resposta" placeholder="?" autofocus > </div> 
<button id="botao2" onclick="novaConta()" style="margin-left:10px;"> Nova Conta </button>
<button id="botao" onclick="verificar()"> Verificar </button> 

<div class="mensagem" id="mensagem"></div> 
<img id="semaforo" src="sinalvermelho_Antonio.png" alt="Semáforo" width="180" > 
<div class="placar"> <span class="acertos">✅ Acertos: <span id="acertos">0</span>
</span> &nbsp;&nbsp;&nbsp; <span class="erros"> ❌ Erros: <span id="erros">0</span> </span> </div> </div>

<script> 
// ====================================== 
// VARIÁVEIS DO JOGO 
// ======================================
let totalAcertos = 0; 
let totalErros = 0;
let numero1;
let numero2; 
let operacao;
let ultimaOperacao = "";
let resultado; 
let audioAtual = null;
// ====================================== 
// GERAR NÚMERO ALEATÓRIO 
// ====================================== 
function numeroAleatorio(min, max) 
{ return Math.floor( Math.random() * (max - min + 1) ) + min; 
} 
// ======================================
// GERAR NOVA CONTA
// ====================================== 
function novaConta() 
{ 
numero1 = numeroAleatorio(1, 20); 
numero2 = numeroAleatorio(1, 20); 
const operacoes = ["+", "-", "*", "/"]; 
do {
    operacao = operacoes[numeroAleatorio(0, 3)];
} while (operacao === ultimaOperacao);

ultimaOperacao = operacao;

operacao = operacoes[numeroAleatorio(0, operacoes.length - 1) ]; 
//Operação de "x" so entre numeros menores do que 10
if (operacao === "*" && (numero1 > 10 || numero2 > 10)) {
    return;
}
// Evita resultados negativos 
if (operacao === "-" && numero2 > numero1)
 { let temp = numero1; numero1 = numero2; numero2 = temp; } 

// Para divisão, cria contas com resultado inteiro
 if (operacao === "/") { resultado = numeroAleatorio(1, 10); numero2 = numeroAleatorio(1, 10); numero1 = resultado * numero2; } 
// Calcula o resultado 
switch (operacao) { 
case "+": resultado = numero1 + numero2; break; 
case "-": resultado = numero1 - numero2; break; 
case "*": resultado = numero1 * numero2; break; 
case "/": resultado = numero1 / numero2; break; } 

// Mostra a conta 
document.getElementById("num1").textContent = numero1; 
document.getElementById("num2").textContent = numero2; 
document.getElementById("operador").textContent = operacao === "*" ? "×" : operacao === "/" ? "÷" : operacao; 
// Limpa resposta 
document.getElementById("resposta").value = "";
 document.getElementById("resposta").focus();
 // Limpa mensagem 
document.getElementById("mensagem").textContent = "";
 }
 // ====================================== 
// VERIFICAR RESPOSTA 
// ======================================
 function verificar()
 { const campo = document.getElementById("resposta"); 
const resposta = parseFloat(campo.value); 
if (isNaN(resposta))
 { alert("Digite uma resposta."); campo.focus(); return; } 
// Desativa botão 
document.getElementById("botao").disabled = true; 
document.getElementById("botao2").disabled = true; 
// Para áudio anterior
 if (audioAtual) { audioAtual.pause(); audioAtual.currentTime = 0;
 } 
// ================================== 
// ACERTO 
// ==================================
 if (resposta === resultado) {

    // ACERTO
    document.getElementById("semaforo").src =
        "sinalverde_Antonio.png";

    document.getElementById("mensagem").textContent =
        "Muito bem! 🎉";

    totalAcertos++;

    document.getElementById("acertos").textContent =
        totalAcertos;

    audioAtual = new Audio("TiozinhoTiozao.mp4");
    audioAtual.play().catch(function() {});

}
else {

    // ERRO
    document.getElementById("semaforo").src =
        "sinalvermelho_Antonio.png";

    document.getElementById("mensagem").textContent =
        "Resposta errada! 💥";

    totalErros++;

    document.getElementById("erros").textContent =
        totalErros;

    audioAtual = new Audio("Explosao.mp4");
    audioAtual.play().catch(function() {});


    // O GIF SÓ SERÁ MOSTRADO NO ERRO
    setTimeout(function() {

        document.getElementById("semaforo").src =
            "bomb-bone.gif";

    }, 2000);
}

// DEPOIS DE 6 SEGUNDOS 
// ================================== 
setTimeout(function() { document.getElementById("semaforo").src = "sinalvermelho_Antonio.png"; 
document.getElementById("botao2").disabled = false;
document.getElementById("botao").disabled = false; }, 6000); }
 // ====================================== 
// PERMITIR ENTER PARA RESPONDER 
// ====================================== 
document.getElementById("resposta") .addEventListener("keydown", function(event) { if (event.key === "Enter") { verificar(); } });
 

</script> </body> </html>
